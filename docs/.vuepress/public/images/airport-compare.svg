<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f7fb"/><text x="110" y="125" font-family="Arial" font-size="48" font-weight="700" fill="#243b72">机场对比应该看什么？</text><text x="110" y="185" font-family="Arial" font-size="28" fill="#64748b">不要只比较月付价格，用统一维度评估真实成本</text><g font-family="Arial"><g transform="translate(120,285)"><rect width="300" height="340" rx="24" fill="white" stroke="#dbe3ef" stroke-width="4"/><text x="35" y="70" font-size="30" font-weight="700" fill="#243b72">套餐价格</text><text x="35" y="130" font-size="25" fill="#475569">月付 / 年付</text><text x="35" y="180" font-size="25" fill="#475569">流量与倍率</text><text x="35" y="230" font-size="25" fill="#475569">重置规则</text></g><g transform="translate(500,285)"><rect width="300" height="340" rx="24" fill="white" stroke="#dbe3ef" stroke-width="4"/><text x="35" y="70" font-size="30" font-weight="700" fill="#23786e">网络表现</text><text x="35" y="130" font-size="25" fill="#475569">延迟 / 丢包</text><text x="35" y="180" font-size="25" fill="#475569">晚高峰稳定性</text><text x="35" y="230" font-size="25" fill="#475569">常用地区</text></g><g transform="translate(880,285)"><rect width="300" height="340" rx="24" fill="white" stroke="#dbe3ef" stroke-width="4"/><text x="35" y="70" font-size="30" font-weight="700" fill="#243b72">客户端</text><text x="35" y="130" font-size="25" fill="#475569">手机 / 电脑</text><text x="35" y="180" font-size="25" fill="#475569">路由器兼容</text><text x="35" y="230" font-size="25" fill="#475569">教程与售后</text></g><g transform="translate(1260,285)"><rect width="250" height="340" rx="24" fill="#e8f5f2"/><text x="35" y="70" font-size="30" font-weight="700" fill="#23786e">风险</text><text x="35" y="130" font-size="25" fill="#475569">隐私政策</text><text x="35" y="180" font-size="25" fill="#475569">退款条款</text><text x="35" y="230" font-size="25" fill="#475569">自动续费</text></g></g><text x="110" y="760" font-family="Arial" font-size="28" fill="#64748b">结论：价格只是筛选条件，不是最终答案。</text></svg>
