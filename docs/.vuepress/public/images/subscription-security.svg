<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f7fb"/><text x="120" y="120" font-family="Arial" font-size="48" font-weight="700" fill="#243b72">订阅链接安全三原则</text><g font-family="Arial"><g transform="translate(150,285)"><circle cx="120" cy="120" r="105" fill="#243b72"/><text x="120" y="140" text-anchor="middle" font-size="60" fill="white">1</text><text x="120" y="300" text-anchor="middle" font-size="30" font-weight="700" fill="#243b72">不公开</text><text x="120" y="350" text-anchor="middle" font-size="24" fill="#475569">不要发群聊、论坛</text></g><g transform="translate(650,285)"><circle cx="120" cy="120" r="105" fill="#2a9d8f"/><text x="120" y="140" text-anchor="middle" font-size="60" fill="white">2</text><text x="120" y="300" text-anchor="middle" font-size="30" font-weight="700" fill="#243b72">会重置</text><text x="120" y="350" text-anchor="middle" font-size="24" fill="#475569">泄露或异常就重置</text></g><g transform="translate(1150,285)"><circle cx="120" cy="120" r="105" fill="#243b72"/><text x="120" y="140" text-anchor="middle" font-size="60" fill="white">3</text><text x="120" y="300" text-anchor="middle" font-size="30" font-weight="700" fill="#243b72">先短期</text><text x="120" y="350" text-anchor="middle" font-size="24" fill="#475569">确认稳定再长期购买</text></g><rect x="260" y="690" width="1080" height="80" rx="18" fill="#fff1f2"/><text x="800" y="742" text-anchor="middle" font-family="Arial" font-size="28" fill="#be123c">订阅链接通常等同于账户钥匙，请像保护密码一样保护它</text></svg>
