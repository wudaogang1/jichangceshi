<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f7fb"/><text x="120" y="120" font-family="Arial" font-size="48" font-weight="700" fill="#243b72">机场测速记录表</text><text x="120" y="175" font-family="Arial" font-size="28" fill="#64748b">同一设备、同一网络、不同时间段重复测试</text><rect x="120" y="250" width="1360" height="420" rx="20" fill="white" stroke="#cbd5e1" stroke-width="4"/><g font-family="Arial" font-size="28" fill="#243b72"><text x="180" y="320">时间段</text><text x="470" y="320">节点地区</text><text x="760" y="320">延迟</text><text x="970" y="320">丢包</text><text x="1170" y="320">网页 / 视频体验</text></g><g stroke="#dbe3ef" stroke-width="3"><path d="M150 350 H1450 M150 430 H1450 M150 510 H1450 M150 590 H1450"/><path d="M420 270 V650 M700 270 V650 M900 270 V650 M1100 270 V650"/></g><g font-family="Arial" font-size="25" fill="#475569"><text x="180" y="400">白天</text><text x="470" y="400">日本 / 香港</text><text x="760" y="400">记录 ms</text><text x="970" y="400">记录 %</text><text x="1170" y="400">打开网页、播放视频</text><text x="180" y="480">晚高峰</text><text x="470" y="480">美国 / 新加坡</text><text x="760" y="480">记录 ms</text><text x="970" y="480">记录 %</text><text x="1170" y="480">下载、会议、AI 服务</text><text x="180" y="560">连续 2 天</text><text x="470" y="560">常用节点</text><text x="760" y="560">取平均</text><text x="970" y="560">取平均</text><text x="1170" y="560">记录断线和切换恢复</text></g></svg>
