<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f7fb"/><text x="120" y="120" font-family="Arial" font-size="48" font-weight="700" fill="#243b72">客户端导入订阅通用流程</text><g font-family="Arial" text-anchor="middle"><g transform="translate(140,310)"><circle cx="120" cy="100" r="90" fill="#243b72"/><text x="120" y="118" font-size="55" fill="white">1</text><text x="120" y="260" font-size="28" font-weight="700" fill="#243b72">复制订阅</text><text x="120" y="305" font-size="22" fill="#475569">机场后台</text></g><g transform="translate(480,310)"><circle cx="120" cy="100" r="90" fill="#2a9d8f"/><text x="120" y="118" font-size="55" fill="white">2</text><text x="120" y="260" font-size="28" font-weight="700" fill="#243b72">添加配置</text><text x="120" y="305" font-size="22" fill="#475569">URL / 二维码</text></g><g transform="translate(820,310)"><circle cx="120" cy="100" r="90" fill="#243b72"/><text x="120" y="118" font-size="55" fill="white">3</text><text x="120" y="260" font-size="28" font-weight="700" fill="#243b72">选择节点</text><text x="120" y="305" font-size="22" fill="#475569">代理组</text></g><g transform="translate(1160,310)"><circle cx="120" cy="100" r="90" fill="#2a9d8f"/><text x="120" y="118" font-size="55" fill="white">4</text><text x="120" y="260" font-size="28" font-weight="700" fill="#243b72">开启连接</text><text x="120" y="305" font-size="22" fill="#475569">允许 VPN 权限</text></g></g><rect x="300" y="690" width="1000" height="80" rx="18" fill="#e8f5f2"/><text x="800" y="742" text-anchor="middle" font-family="Arial" font-size="28" fill="#23786e">先规则模式，遇到问题再排查全局、DNS 和其他代理冲突</text></svg>
